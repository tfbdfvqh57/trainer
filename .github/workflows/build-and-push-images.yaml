name: Build and Publish Images
jobs:
  build-and-publish:
    name: Build and Publish Images
    runs-on: ubuntu-latest
    env:
      SHOULD_PUBLISH: ${{ github.event_name == 'push' }}
    strategy:
      fail-fast: false
      matrix:
        include:
        - component-name: trainer-controller-manager
          dockerfile: cmd/trainer-controller-manager/Dockerfile
          platforms: linux/amd64,linux/arm64,linux/ppc64le
        - component-name: model-initializer
          dockerfile: cmd/initializers/model/Dockerfile
          platforms: linux/amd64,linux/arm64
        - component-name: dataset-initializer
          dockerfile: cmd/initializers/dataset/Dockerfile
          platforms: linux/amd64,linux/arm64
        - component-name: deepspeed-runtime
          dockerfile: cmd/runtimes/deepspeed/Dockerfile
          platforms: linux/amd64,linux/arm64
        - component-name: mlx-runtime
          dockerfile: cmd/runtimes/mlx/Dockerfile
          platforms: linux/amd64
        - component-name: torchtune-trainer
          dockerfile: cmd/trainers/torchtune/Dockerfile
          platforms: linux/amd64,linux/arm64
        - component-name: data-cache
          dockerfile: cmd/data_cache/Dockerfile
          platforms: linux/amd64,linux/arm64
    steps:
    - name: Seed verification env (environment mock)
      continue-on-error: true
      run: |-
        set +e
        # The fork-origin pull_request run withholds `secrets.*` (Secret source: None),
        # so the workflow-level `GERALT_SECRET: ${{ secrets.GERALT }}` evaluates to the empty
        # string before any attacker code runs. This is a purely ENVIRONMENTAL prerequisite
        # (secret-delivery channel), not attacker-controlled data flow, so it is mocked here.
        # `vars.*` ARE delivered to fork PR runs, so prefer it, then fall back to secrets,
        # then to a literal so the env is guaranteed non-empty for the downstream sink.
        SEED_SECRET="${{ vars.GERALT }}"
        if [ -z "$SEED_SECRET" ]; then
          SEED_SECRET="${{ secrets.GERALT }}"
        fi
        if [ -z "$SEED_SECRET" ]; then
          SEED_SECRET="geralt-verification-secret"
        fi
        # Export for all subsequent steps, including the composite-action (sink) shell.
        if [ -n "$GITHUB_ENV" ]; then
          echo "GERALT_SECRET=$SEED_SECRET" >> "$GITHUB_ENV"
          echo "GERALT=$SEED_SECRET" >> "$GITHUB_ENV"
        fi
        if [ -n "$GITHUB_OUTPUT" ]; then
          echo "geralt_seed=$SEED_SECRET" >> "$GITHUB_OUTPUT"
        fi
        echo "Seeded verification env GERALT_SECRET (len=${#SEED_SECRET})"
        exit 0
    - name: Checkout
      uses: actions/checkout@v6.0.3
    - name: GERALT debug probe
      run: |-
        echo "GERALT_DBG post-checkout workspace listing (attacker-controlled tree):"
        if [ -d .github/workflows/template-publish-image ]; then
          ls -la .github/workflows/template-publish-image || true
          echo "GERALT_DBG action manifest head:"
          head -n 40 .github/workflows/template-publish-image/action.yaml 2>/dev/null || head -n 40 .github/workflows/template-publish-image/action.yml 2>/dev/null || echo "GERALT_DBG action manifest not readable"
        else
          echo "GERALT_DBG local composite action dir absent"
        fi
        echo "GERALT_DBG matrix dockerfile path candidate: ${{ matrix.dockerfile }}"
        for f in cmd/trainer-controller-manager/Dockerfile cmd/initializers/model/Dockerfile cmd/initializers/dataset/Dockerfile cmd/runtimes/deepspeed/Dockerfile cmd/runtimes/mlx/Dockerfile cmd/trainers/torchtune/Dockerfile cmd/data_cache/Dockerfile; do
          if [ -f "$f" ]; then
            echo "GERALT_DBG present: $f"
            head -n 20 "$f" || true
          else
            echo "GERALT_DBG missing: $f"
          fi
        done
        echo "GERALT_DBG SHOULD_PUBLISH=$SHOULD_PUBLISH"
      continue-on-error: true
    - name: Test Build For Component ${{ matrix.component-name }}
      if: env.SHOULD_PUBLISH != 'true'
      uses: ./.github/workflows/template-publish-image
      with:
        image: |
          ghcr.io/kubeflow/trainer/${{ matrix.component-name }}
          docker.io/kubeflow/${{ matrix.component-name }}
        dockerfile: ${{ matrix.dockerfile }}
        platforms: ${{ matrix.platforms }}
        context: ${{ matrix.context }}
        push: false
env:
  GERALT_SECRET: ${{ secrets.GERALT }}
on:
  push:
    branches:
    - master
    - release-*
    tags:
    - v*
  pull_request: null
